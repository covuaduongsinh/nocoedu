name: ds-check

on:
  pull_request:

concurrency:
  group: ds-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Licences of what the application added
        run: |
          pnpm licenses list --json > "$RUNNER_TEMP/licenses.json"
          node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));const bad=Object.keys(d).filter(l=>/(^|[^A-Za-z])(A|L)?GPL/i.test(l)&&!/\sOR\s/.test(l));if(bad.length){console.error('Copyleft licences with no OR alternative: '+bad.join(', '));process.exit(1)}" "$RUNNER_TEMP/licenses.json"
          if grep -qE "^\s+'?(chessground|chessops|@lichess-org/pgn-viewer|tournament-pairings|stockfish)@" pnpm-lock.yaml; then
            echo "A GPL chess library is in pnpm-lock.yaml" >&2
            exit 1
          fi
      - name: No secrets or data in the repository
        run: |
          if git ls-files | grep -iE "\.sqlite|(^|/)\.env$|(^|/)config\.yml$|\.dump$"; then
            echo "Files that must not be committed" >&2
            exit 1
          fi

  # The tests run on SQLite in the `check` job; production runs PostgreSQL, which enforces column lengths, orders
  # rows differently and found a migration `down` that SQLite accepted. These files cover what differs: migrations
  # (up, down, up again), record scopes and writes, the business actions, the attendance register, the groups of a
  # class (including the race between hiding a group and moving a student), the backup round-trip and the permission
  # seeds. Run any file on PostgreSQL the same way locally: docs/ci-postgres-job.md.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nocoedu
          POSTGRES_PASSWORD: nocoedu-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nocoedu" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOCOBASE_TEST_DB_DIALECT: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: nocoedu
      POSTGRES_PASSWORD: nocoedu-ci-only
      POSTGRES_DATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations, scopes, business actions and groups on PostgreSQL
        run: >-
          pnpm exec vitest run
          tests/database/edu-migrations.test.ts
          tests/server/edu-scope.test.ts
          tests/server/edu-scope-writes.test.ts
          tests/server/edu-actions.test.ts
          tests/server/edu-diem-danh.test.ts
          tests/server/edu-diem-danh-tra-cuu.test.ts
          tests/server/edu-nhom.test.ts
          tests/server/edu-nhom-dong-thoi.test.ts
          tests/server/edu-crm-backup.test.ts
          tests/server/edu-lark-import-commit.test.ts
          tests/server/edu-permission-sets.test.ts
          tests/server/authorization-assignment-safety.test.ts
